<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080a">
<link rel="manifest" href="./manifest.webmanifest">
<title>Antonio Cars Service — OT</title>
<style>
:root{--r:#e21b2d;--r2:#ff3345;--bg:#07080a;--c:#14161a;--l:#30343a;--m:#a7abb1;--w:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--w);font:15px system-ui,-apple-system,BlinkMacSystemFont,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.top{padding:12px 15px;background:#090a0c;border-bottom:1px solid #292c31;position:sticky;top:0;z-index:3}
.brand{display:flex;gap:10px;align-items:center;justify-content:center}.logoimg{width:min(420px,92vw);height:auto;max-height:150px;border-radius:8px;object-fit:contain;object-position:center;background:#fff;padding:0;display:block;flex:0 0 auto;image-rendering:auto}.muted{color:var(--m)}
main{max-width:1050px;margin:auto;padding:14px}.nav{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.nav button,.btn{border:1px solid var(--l);background:var(--c);color:#fff;border-radius:9px;padding:10px 12px;white-space:nowrap}.nav .on,.primary{background:var(--r);border-color:var(--r)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:14px;margin-bottom:12px}
.stat{font-size:27px;font-weight:800}label{display:block;font-size:12px;color:#ddd;margin-bottom:9px}input,select,textarea{width:100%;background:#101216;color:#fff;border:1px solid var(--l);border-radius:8px;padding:10px;margin-top:5px}textarea{min-height:75px}
.actions{display:flex;gap:7px;flex-wrap:wrap}.list{display:grid;gap:7px}.item{padding:11px;background:#101216;border:1px solid var(--l);border-radius:10px;cursor:pointer}.pill{border:1px solid var(--l);border-radius:99px;padding:4px 8px;font-size:11px}.red{color:#ff909a;border-color:#7b2029}.green{color:#72e0b5;border-color:#17684b}.total{text-align:right;font-size:21px;font-weight:800;margin-top:12px}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:7px}.empty{text-align:center;color:var(--m);padding:22px}.hidden{display:none!important}
.preview-shell{position:fixed;inset:0;background:#050608;z-index:9999;overflow:auto;padding:12px 10px 90px}.preview-bar{max-width:900px;margin:0 auto 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:0;z-index:2;padding:8px 0;background:#050608}.preview-bar b{font-size:17px}.preview-img{display:block;width:min(100%,900px);height:auto;margin:0 auto;border-radius:8px;box-shadow:0 15px 60px rgba(0,0,0,.65)}.preview-actions{max-width:900px;margin:12px auto 0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
@media(max-width:700px){.grid,.g3{grid-template-columns:1fr}.photos{grid-template-columns:repeat(3,1fr)}}
@media print{.top,.nav,.np{display:none!important}body{background:#fff;color:#111}.card{background:#fff;border:0}.muted{color:#555}}
</style>
</head>
<body>

<header class="top"><div class="brand"><img class="logoimg" src="./logo.svg?v=39" alt="Antonio Cars Service" decoding="async"></div></header>
<main><nav class="nav np"><button data-t="home">Inicio</button><button data-t="new">Nueva OT</button><button data-t="budget">Nuevo presupuesto</button><button data-t="open">OT abiertas</button><button data-t="history">Historial</button><button data-t="clients">Clientes</button><button data-t="backup">Copia / Restaurar</button></nav><div id="app"></div></main>
<div id="toast" class="hidden" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;padding:11px 15px;border-radius:9px;z-index:99999"></div>
<script>
const S="acs_ot_v2",$=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])),money=n=>new Intl.NumberFormat("es-CL",{style:"currency",currency:"CLP",maximumFractionDigits:0}).format(+n||0);
let db=JSON.parse(localStorage.getItem(S)||'{"seq":0,"ots":[],"clients":{},"vehicles":{}}'),edit=null;
function save(){localStorage.setItem(S,JSON.stringify(db))}
function toast(x){let t=$("#toast");t.textContent=x;t.classList.remove("hidden");setTimeout(()=>t.classList.add("hidden"),1900)}
function nextNo(prefix){db.seq++;return prefix+"-"+String(db.seq).padStart(6,"0")}
function no(){return nextNo("OT")}
function fmt(x){return new Date(x).toLocaleString("es-CL",{dateStyle:"short",timeStyle:"short"})}
function plate(x){return String(x||"").toUpperCase().replace(/[^A-Z0-9]/g,"")}
function status(x){return'<span class="pill '+(x=="En reparación"?"red":x=="Listo"||x=="Entregado"?"green":"")+'">'+esc(x)+"</span>"}
function go(t){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==t));({home,new:newOT,budget:newBudget,open,history,clients,backup}[t]||home)()}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>go(b.dataset.t));
function card(o){return'<div class="item" onclick="view(\''+o.id+'\')"><b>'+esc(o.no)+"</b> · "+esc(o.plate)+' <span style="float:right">'+status(o.status)+'</span><div class="muted">'+esc(o.client?.name||"")+" · "+esc(o.vehicle?.make||"")+" "+esc(o.vehicle?.model||"")+" · "+fmt(o.created)+'</div><small>Total '+money(o.total)+"</small><div class=\"actions\" style=\"margin-top:8px\"><button class=\"btn\" type=\"button\" onclick=\"event.stopPropagation();deleteOT('"+o.id+"')\">Eliminar</button></div></div>"}

function home(){$("#app").innerHTML='<div class="g3"><div class="card"><div class="muted">Total OT</div><div class="stat">'+db.ots.length+'</div></div><div class="card"><div class="muted">En reparación</div><div class="stat">'+db.ots.filter(x=>x.status=="En reparación").length+'</div></div><div class="card"><div class="muted">Listas</div><div class="stat">'+db.ots.filter(x=>x.status=="Listo").length+'</div></div></div><div class="card"><div class="actions np"><button class="btn primary" onclick="newOT()">＋ Nueva OT</button><button class="btn" onclick="newBudget()">＋ Nuevo presupuesto</button><button class="btn" onclick="go(\'history\')">Buscar patente</button></div></div><div class="card"><h3>Últimas OT</h3><div class="list">'+db.ots.slice(-8).reverse().map(card).join("")||'<div class="empty">No hay OT.</div>'+"</div></div>"}
function fields(o){let c=o.client||{},v=o.vehicle||{};return'<div class="grid"><div class="card"><h3>Cliente</h3><label>Nombre<input id="name" value="'+esc(c.name)+'"></label><div class="grid"><label>RUT<input id="rut" value="'+esc(c.rut)+'"></label><label>Teléfono<input id="phone" value="'+esc(c.phone)+'"></label></div><label>Email<input id="email" value="'+esc(c.email)+'"></label><label>Dirección<input id="address" value="'+esc(c.address)+'"></label></div><div class="card"><h3>Vehículo</h3><div class="grid"><label>Patente *<input id="plate" maxlength="8" value="'+esc(o.plate)+'" oninput="loadPlate(this.value)"></label><label>Kilometraje<input id="km" type="number" value="'+esc(v.km)+'"></label></div><div class="grid"><label>Marca<input id="make" value="'+esc(v.make)+'"></label><label>Modelo<input id="model" value="'+esc(v.model)+'"></label></div><div class="grid"><label>Año<input id="year" value="'+esc(v.year)+'"></label><label>Color<input id="color" value="'+esc(v.color)+'"></label></div><label>Combustible<select id="fuel"><option></option>'+["Bencina","Diésel","Híbrido","Eléctrico","Otro"].map(x=>'<option '+(x==v.fuel?"selected":"")+'>'+x+"</option>").join("")+'</select></label><label>VIN / Chasis<input id="vin" value="'+esc(v.vin)+'"></label></div></div><div class="card"><h3>Recepción y diagnóstico</h3><div class="grid"><label>Motivo de ingreso<textarea id="reason">'+esc(o.reason)+'</textarea></label><label>Diagnóstico / trabajos<textarea id="diagnosis">'+esc(o.diagnosis)+'</textarea></label></div><div class="grid"><label>Observaciones de recepción<textarea id="reception">'+esc(o.reception)+'</textarea></label><label>Responsable / mecánico<input id="mechanic" value="'+esc(o.mechanic)+'"></label></div><div><label>Checklist</label>'+["Exterior revisado","Interior revisado","Luces/testigos registrados","Combustible registrado"].map((x,i)=>'<label><input type="checkbox" id="ch'+i+'" style="width:auto" '+(o.checks?.[i]?"checked":"")+'>'+x+"</label>").join("")+"</div></div>"}
function newBudget(){edit={id:"",no:nextNo("PS"),created:new Date().toISOString(),status:"Pendiente",items:[],photos:[],checks:[],mode:"presupuesto"};newOT(edit)}
function deleteOT(id){let o=db.ots.find(x=>x.id===id);if(!o)return;let tipo=o.mode=="presupuesto"?"presupuesto":"OT";if(!confirm("¿Eliminar "+tipo+" "+o.no+"? Esta acción no se puede deshacer."))return;db.ots=db.ots.filter(x=>x.id!==id);save();edit=null;toast(tipo+" eliminado");setTimeout(()=>go("home"),250)}
function editOT(id){let o=db.ots.find(x=>x.id===id);if(o)newOT(o);else toast("Documento no encontrado")}
function newOT(o){invalidateShareCache();if(o)edit=o;else edit={id:"",no:no(),created:new Date().toISOString(),status:"Ingresado",items:[],photos:[],checks:[]};$("#app").innerHTML='<div class="card"><h2>'+(edit.mode=="presupuesto"?"Presupuesto ":"Orden de Trabajo ")+esc(edit.no)+'</h2><div class="muted">'+fmt(edit.created)+'</div></div>'+fields(edit)+'<div class="card"><h3>Repuestos y mano de obra</h3><div id="items"></div><div class="actions np"><button class="btn primary" onclick="item(\'part\')">＋ Agregar repuesto</button><button class="btn primary" onclick="item(\'labor\')">＋ Agregar mano de obra</button></div><div id="total" class="total"></div></div><div class="card"><h3>Fotos de recepción</h3><input class="np" type="file" accept="image/*" multiple onchange="addPhotos(event)"><div id="photos" class="photos"></div></div><div class="card"><h3>Estado</h3><select id="status">'+["Ingresado","Diagnóstico","Esperando aprobación","En reparación","Listo","Entregado"].map(x=>'<option '+(x==edit.status?"selected":"")+'>'+x+"</option>").join("")+'</select><label>Observaciones finales<textarea id="obs">'+esc(edit.obs)+'</textarea></label></div><div class="actions np"><button class="btn primary" onclick="saveOT()">Guardar '+(edit.mode=="presupuesto"?"presupuesto":"OT")+'</button><button class="btn" onclick="go(\'home\')">Cancelar</button></div>';drawItems();drawPhotos()}
function val(id){return $("#"+id)?.value||""}
function loadPlate(p){let v=db.vehicles[plate(p)];if(!v)return;let c=db.clients[v.ck]||{};Object.keys(v).filter(k=>k!="ck").forEach(k=>{if($("#"+k))$("#"+k).value=v[k]});[["name","name"],["rut","rut"],["phone","phone"],["email","email"],["address","address"]].forEach(([a,b])=>{if(c[b]&&$("#"+a))$("#"+a).value=c[b]})}
function item(t){edit.items=edit.items||[];edit.items.push({type:t,desc:"",qty:1,price:0});drawItems();persistCurrentOT();setTimeout(()=>{let a=document.querySelectorAll("#items input.desc");a[a.length-1]?.focus()},50)}
function drawItems(){let a=edit.items||[],parts=a.filter(x=>x.type=="part"),labor=a.filter(x=>x.type=="labor");const section=(title,type,arr)=>'<div class="card" style="margin:10px 0;background:#101014"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>'+title+'</b><button type="button" class="btn" data-add-type="'+type+'">＋ Agregar</button></div>'+(arr.length?arr.map(x=>{let i=a.indexOf(x);return'<div class="line-item" data-i="'+i+'" style="padding:10px 0;border-bottom:1px solid var(--l)"><div class="grid" style="grid-template-columns:2fr .7fr 1fr auto;align-items:end"><label>Descripción<input class="desc" data-i="'+i+'" value="'+esc(x.desc||"")+'" placeholder="'+(type=="part"?"Ej: Filtro de aceite":"Ej: Cambio de aceite")+'"></label><label>Cantidad<input class="qty" data-i="'+i+'" type="number" min="1" value="'+(x.qty||1)+'"></label><label>Precio unitario<input class="price" data-i="'+i+'" type="number" min="0" value="'+(x.price||0)+'"></label><button type="button" class="btn del-item" data-i="'+i+'">×</button></div><div class="muted subtotal" style="text-align:right">Subtotal: '+money((x.qty||1)*(x.price||0))+'</div></div>'}).join(""):'<div class="muted" style="padding:10px 0">No hay '+(type=="part"?"repuestos":"mano de obra")+' agregados.</div>')+'</div>';$("#items").innerHTML=section("Repuestos","part",parts)+section("Mano de obra","labor",labor);$("#items").querySelectorAll("[data-add-type]").forEach(el=>el.addEventListener("click",()=>item(el.dataset.addType)));$("#items").querySelectorAll("input.desc").forEach(el=>el.addEventListener("input",e=>{let i=+e.target.dataset.i;edit.items[i].desc=e.target.value;persistCurrentOT();drawItemTotals()}));$("#items").querySelectorAll("input.qty").forEach(el=>el.addEventListener("input",e=>{let i=+e.target.dataset.i;edit.items[i].qty=+e.target.value||1;persistCurrentOT();drawItemTotals()}));$("#items").querySelectorAll("input.price").forEach(el=>el.addEventListener("input",e=>{let i=+e.target.dataset.i;edit.items[i].price=+e.target.value||0;persistCurrentOT();drawItemTotals()}));$("#items").querySelectorAll(".del-item").forEach(el=>el.addEventListener("click",e=>{let i=+e.currentTarget.dataset.i;edit.items.splice(i,1);persistCurrentOT();drawItems()}));drawItemTotals()}
function drawItemTotals(){let t=0;$("#items").querySelectorAll(".line-item").forEach(el=>{let i=+el.dataset.i,x=edit.items[i];if(x){let sub=(+x.qty||1)*(+x.price||0);t+=sub;let z=el.querySelector(".subtotal");if(z)z.textContent="Subtotal: "+money(sub)}});edit.total=t;if($("#total"))$("#total").textContent="Total: "+money(t)}
function addPhotos(e){let files=[...e.target.files].filter(f=>f.type.startsWith("image/"));if(!files.length)return;let pending=files.length,failed=0;edit.photos=edit.photos||[];files.forEach(f=>compressPhoto(f,data=>{if(data)edit.photos.push({data,name:f.name,type:"image/jpeg",created:new Date().toISOString()});else failed++;pending--;if(pending<=0){persistCurrentOT();drawPhotos();toast(failed?"Fotos guardadas con algunas excepciones":"Fotos guardadas")} }))} 
function compressPhoto(file,done){let r=new FileReader;r.onload=()=>{let im=new Image;im.onload=()=>{let max=1600,scale=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),w=Math.max(1,Math.round(im.naturalWidth*scale)),h=Math.max(1,Math.round(im.naturalHeight*scale)),c=document.createElement("canvas"),x=c.getContext("2d");c.width=w;c.height=h;x.drawImage(im,0,0,w,h);done(c.toDataURL("image/jpeg",.82))};im.onerror=()=>done(null);im.src=r.result};r.onerror=()=>done(null);r.readAsDataURL(file)}
function persistCurrentOT(){if(!edit)return;let i=db.ots.findIndex(x=>x.id==edit.id);if(i<0){if(!edit.id)edit.id=crypto.randomUUID();db.ots.push(edit)}else db.ots[i]=edit;save()}
function drawPhotos(){$("#photos").innerHTML=(edit.photos||[]).map((p,i)=>{let src=typeof p=="string"?p:p.data;return'<div><img src="'+src+'"><button class="btn np" onclick="removePhoto('+i+')">×</button><small>'+esc(typeof p=="string"?"Foto "+(i+1):(p.name||"Foto "+(i+1)))+'</small></div>'}).join("")}
function removePhoto(i){if(!edit.photos)return;edit.photos.splice(i,1);persistCurrentOT();drawPhotos();toast("Foto eliminada")}
function saveOT(){if(edit?.items){document.querySelectorAll("#items .desc").forEach(el=>{let i=+el.dataset.i;if(edit.items[i])edit.items[i].desc=el.value});document.querySelectorAll("#items .qty").forEach(el=>{let i=+el.dataset.i;if(edit.items[i])edit.items[i].qty=+el.value||1});document.querySelectorAll("#items .price").forEach(el=>{let i=+el.dataset.i;if(edit.items[i])edit.items[i].price=+el.value||0});edit.total=(edit.items||[]).reduce((t,x)=>t+(+x.qty||1)*(+x.price||0),0)}let p=plate(val("plate"));if(!p)return toast("Ingresa la patente");let c={name:val("name"),rut:val("rut"),phone:val("phone"),email:val("email"),address:val("address")},v={km:val("km"),make:val("make"),model:val("model"),year:val("year"),color:val("color"),fuel:val("fuel"),vin:val("vin"),ck:c.rut||c.name};edit.plate=p;edit.client=c;edit.vehicle=v;edit.reason=val("reason");edit.diagnosis=val("diagnosis");edit.reception=val("reception");edit.mechanic=val("mechanic");edit.status=val("status");edit.obs=val("obs");edit.checks=[0,1,2,3].map(i=>$("#ch"+i)?.checked);edit.updated=new Date().toISOString();let i=db.ots.findIndex(x=>x.id==edit.id);if(i<0){edit.id=crypto.randomUUID();db.ots.push(edit)}else db.ots[i]=edit;db.clients[c.rut||c.name]=c;v.ck=c.rut||c.name;db.vehicles[p]=v;save();toast("Guardado");setTimeout(()=>view(edit.id),250)}
function view(id){edit=db.ots.find(x=>x.id==id);if(!edit)return;invalidateShareCache();$("#app").innerHTML='<div class="card"><div class="actions np"><button class="btn" onclick="go(\'home\')">← Inicio</button><button class="btn primary" onclick="editOT(edit.id)">Editar</button><button class="btn" onclick="printOT()">Imprimir / PDF</button><button class="btn" onclick="deleteOT(edit.id)">Eliminar</button><button class="btn primary" onclick="showBudgetImage()">Vista previa profesional</button><button class="btn primary" onclick="shareBudgetImage()">Compartir imagen profesional</button><button class="btn" onclick="shareBudgetImage()">WhatsApp · Imagen</button></div><h2>'+(edit.mode=="presupuesto"?"PRESUPUESTO ":"ORDEN DE TRABAJO ")+esc(edit.no)+'</h2><div class="muted">'+fmt(edit.created)+' · '+status(edit.status)+'</div></div><div class="grid"><div class="card"><h3>Cliente</h3><b>'+esc(edit.client?.name||"")+'</b><p>RUT: '+esc(edit.client?.rut||"")+'<br>Tel: '+esc(edit.client?.phone||"")+'<br>'+esc(edit.client?.email||"")+'<br>'+esc(edit.client?.address||"")+'</p></div><div class="card"><h3>Vehículo</h3><b>'+esc(edit.plate||"")+'</b> · '+esc(edit.vehicle?.make||"")+" "+esc(edit.vehicle?.model||"")+'<p>Año: '+esc(edit.vehicle?.year||"")+' · KM: '+esc(edit.vehicle?.km||"")+'<br>VIN: '+esc(edit.vehicle?.vin||"")+'<br>'+esc(edit.vehicle?.color||"")+' · '+esc(edit.vehicle?.fuel||"")+'</p></div></div><div class="card"><h3>Recepción</h3><p>'+esc(edit.reason||"")+'</p><h3>Diagnóstico / trabajos</h3><p>'+esc(edit.diagnosis||"")+'</p><p>'+esc(edit.reception||"")+'</p><p>Responsable: <b>'+esc(edit.mechanic||"")+'</b></p></div><div class="card"><h3>Repuestos y mano de obra</h3><div class="actions np"><button class="btn primary" onclick="editOT(edit.id)">Modificar y agregar ítems</button></div><table style="width:100%"><tbody>'+((edit.items||[]).map(x=>'<tr><td>'+esc(x.type=="part"?"Repuesto":"Mano de obra")+'</td><td>'+esc(x.desc)+'</td><td>'+x.qty+'</td><td>'+money(x.price)+'</td><td>'+money((+x.qty||1)*(+x.price||0))+'</td></tr>').join(""))+'</tbody></table><div class="total">TOTAL '+money(edit.total)+'</div></div><div class="card"><h3>Fotos</h3><div class="photos">'+(edit.photos||[]).map(p=>'<img src="'+(typeof p=="string"?p:p.data)+'">').join("")+'</div></div>'}
function quickAdd(id,type){let o=db.ots.find(x=>x.id===id);if(!o)return;o.items=o.items||[];o.items.push({type,desc:"",qty:1,price:0});edit=o;save();newOT(o);setTimeout(()=>{let a=document.querySelectorAll("#items input.desc");a[a.length-1]?.focus()},80)}
function printOT(){window.print()}
function rr(ctx,x,y,w,h,r,fill,stroke){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else{ctx.rect(x,y,w,h)}if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function txt(ctx,t,x,y,size,weight,fill,align){ctx.font=weight+" "+size+"px Arial,sans-serif";ctx.fillStyle=fill||"#111";ctx.textAlign=align||"left";ctx.fillText(String(t??""),x,y);ctx.textAlign="left"}
function wrapCanvasText(ctx,text,maxWidth){let words=String(text||"").split(/\s+/),lines=[],line="";words.forEach(w=>{let test=line?line+" "+w:w;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=w}else line=test});if(line)lines.push(line);return lines}
function fitText(ctx,text,maxWidth,maxSize,minSize,weight){let s=maxSize;while(s>minSize){ctx.font=weight+" "+s+"px Arial,sans-serif";if(ctx.measureText(String(text||"")).width<=maxWidth)return s;s-=1}return minSize}
function drawIcon(ctx,x,y,type){ctx.save();ctx.fillStyle="#111";ctx.strokeStyle="#111";ctx.lineWidth=5;if(type=="user"){ctx.beginPath();ctx.arc(x,y-10,12,0,Math.PI*2);ctx.fill();ctx.fillRect(x-20,y+8,40,24)}else if(type=="car"){ctx.strokeRect(x-25,y-4,50,25);ctx.beginPath();ctx.moveTo(x-18,y-4);ctx.lineTo(x-8,y-22);ctx.lineTo(x+10,y-22);ctx.lineTo(x+20,y-4);ctx.stroke();ctx.beginPath();ctx.arc(x-14,y+23,6,0,Math.PI*2);ctx.arc(x+14,y+23,6,0,Math.PI*2);ctx.stroke()}else if(type=="wrench"){ctx.beginPath();ctx.moveTo(x-20,y+18);ctx.lineTo(x+12,y-14);ctx.stroke();ctx.beginPath();ctx.arc(x+18,y-20,10,.3,2.4);ctx.stroke()}else if(type=="calendar"){ctx.strokeRect(x-20,y-18,40,38);ctx.beginPath();ctx.moveTo(x-20,y-5);ctx.lineTo(x+20,y-5);ctx.stroke();ctx.fillRect(x-10,y-25,5,12);ctx.fillRect(x+5,y-25,5,12)}else if(type=="note"){ctx.strokeRect(x-17,y-22,34,44);ctx.beginPath();ctx.moveTo(x-8,y-10);ctx.lineTo(x+10,y-10);ctx.moveTo(x-8,y);ctx.lineTo(x+10,y);ctx.moveTo(x-8,y+10);ctx.lineTo(x+7,y+10);ctx.stroke()}ctx.restore()}
let shareCache={key:"",blob:null};
function invalidateShareCache(){shareCache={key:"",blob:null}}
