<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0d"><link rel="manifest" href="./manifest.webmanifest"><title>Antonio Cars Service — OT</title><style>:root{--r:#e21b2d;--bg:#0b0b0d;--c:#151518;--l:#303038;--m:#aaa;--w:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--w);font:15px system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{padding:12px 15px;background:#09090b;border-bottom:1px solid var(--l);position:sticky;top:0;z-index:3}.brand{display:flex;gap:10px;align-items:center}.logoimg{width:64px;height:48px;border-radius:8px;object-fit:contain;background:#fff;padding:2px}.muted{color:var(--m)}main{max-width:1050px;margin:auto;padding:14px}.nav{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.nav button,.btn{border:1px solid var(--l);background:var(--c);color:#fff;border-radius:9px;padding:10px 12px;white-space:nowrap}.nav .on,.primary{background:var(--r);border-color:var(--r)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:14px;margin-bottom:12px}.stat{font-size:27px;font-weight:800}label{display:block;font-size:12px;color:#ddd;margin-bottom:9px}input,select,textarea{width:100%;background:#101014;color:#fff;border:1px solid var(--l);border-radius:8px;padding:10px;margin-top:5px}textarea{min-height:75px}.row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:7px;margin:8px 0}.actions{display:flex;gap:7px;flex-wrap:wrap}.list{display:grid;gap:7px}.item{padding:11px;background:#101014;border:1px solid var(--l);border-radius:10px;cursor:pointer}.pill{border:1px solid var(--l);border-radius:99px;padding:4px 8px;font-size:11px}.red{color:#ff909a;border-color:#7b2029}.green{color:#72e0b5;border-color:#17684b}.total{text-align:right;font-size:21px;font-weight:800;margin-top:12px}.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:7px}.empty{text-align:center;color:var(--m);padding:22px}.hidden{display:none!important}@media(max-width:700px){.grid,.g3{grid-template-columns:1fr}.row{grid-template-columns:1fr}.photos{grid-template-columns:repeat(3,1fr)}}@media print{.top,.nav,.np{display:none!important}body{background:#fff;color:#111}.card{background:#fff;border:0}.muted{color:#555}}</style></head><body><header class="top"><div class="brand"><img class="logoimg" src="./logo.jpg" alt="Antonio Cars Service"><div><b>ANTONIO CARS SERVICE</b><div class="muted">Órdenes de Trabajo · Chile</div></div></div></header><main><nav class="nav np"><button data-t="home">Inicio</button><button data-t="new">Nueva OT</button><button data-t="budget">Nuevo presupuesto</button><button data-t="open">OT abiertas</button><button data-t="history">Historial</button><button data-t="clients">Clientes</button><button data-t="backup">Copia / Restaurar</button></nav><div id="app"></div></main><div id="toast" class="hidden" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;padding:11px 15px;border-radius:9px;z-index:9"></div><script>
const S="acs_ot_v2", $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m])), money=n=>new Intl.NumberFormat("es-CL",{style:"currency",currency:"CLP",maximumFractionDigits:0}).format(+n||0);let db=JSON.parse(localStorage.getItem(S)||'{"seq":0,"ots":[],"clients":{},"vehicles":{}}'),edit=null;function save(){localStorage.setItem(S,JSON.stringify(db))}function toast(x){let t=$("#toast");t.textContent=x;t.classList.remove("hidden");setTimeout(()=>t.classList.add("hidden"),1800)}function no(){db.seq++;return"OT-"+String(db.seq).padStart(6,"0")}function fmt(x){return new Date(x).toLocaleString("es-CL",{dateStyle:"short",timeStyle:"short"})}function plate(x){return String(x||"").toUpperCase().replace(/[^A-Z0-9]/g,"")}function status(x){return'<span class="pill '+(x=="En reparación"?"red":x=="Listo"||x=="Entregado"?"green":"")+'">'+esc(x)+"</span>"}function go(t){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==t));({home, new:newOT,budget:newBudget,open,history,clients,backup}[t]||home)()}document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>go(b.dataset.t));
function card(o){return'<div class="item" onclick="view(\''+o.id+'\')"><b>'+esc(o.no)+"</b> · "+esc(o.plate)+' <span style="float:right">'+status(o.status)+'</span><div class="muted">'+esc(o.client.name)+" · "+esc(o.vehicle.make)+" "+esc(o.vehicle.model)+" · "+fmt(o.created)+'</div><small>Total '+money(o.total)+"</small></div>"}function home(){$("#app").innerHTML='<div class="g3"><div class="card"><div class="muted">Total OT</div><div class="stat">'+db.ots.length+'</div></div><div class="card"><div class="muted">En reparación</div><div class="stat">'+db.ots.filter(x=>x.status=="En reparación").length+'</div></div><div class="card"><div class="muted">Listas</div><div class="stat">'+db.ots.filter(x=>x.status=="Listo").length+'</div></div></div><div class="card"><div class="actions np"><button class="btn primary" onclick="newOT()">＋ Nueva OT</button><button class="btn" onclick="newBudget()">＋ Nuevo presupuesto</button><button class="btn" onclick="go(\'history\')">Buscar patente</button></div></div><div class="card"><h3>Últimas OT</h3><div class="list">'+db.ots.slice(-8).reverse().map(card).join("")||'<div class="empty">No hay OT.</div>'+"</div></div>"}function fields(o){let c=o.client||{},v=o.vehicle||{};return'<div class="grid"><div class="card"><h3>Cliente</h3><label>Nombre<input id="name" value="'+esc(c.name)+'"></label><div class="grid"><label>RUT<input id="rut" value="'+esc(c.rut)+'"></label><label>Teléfono<input id="phone" value="'+esc(c.phone)+'"></label></div><label>Email<input id="email" value="'+esc(c.email)+'"></label><label>Dirección<input id="address" value="'+esc(c.address)+'"></label></div><div class="card"><h3>Vehículo</h3><div class="grid"><label>Patente *<input id="plate" maxlength="8" value="'+esc(o.plate)+'" oninput="loadPlate(this.value)"></label><label>Kilometraje<input id="km" type="number" value="'+esc(v.km)+'"></label></div><div class="grid"><label>Marca<input id="make" value="'+esc(v.make)+'"></label><label>Modelo<input id="model" value="'+esc(v.model)+'"></label></div><div class="grid"><label>Año<input id="year" value="'+esc(v.year)+'"></label><label>Color<input id="color" value="'+esc(v.color)+'"></label></div><label>Combustible<select id="fuel"><option></option>'+["Bencina","Diésel","Híbrido","Eléctrico","Otro"].map(x=>'<option '+(x==v.fuel?"selected":"")+'>'+x+"</option>").join("")+'</select></label><label>VIN / Chasis<input id="vin" value="'+esc(v.vin)+'"></label></div></div><div class="card"><h3>Recepción y diagnóstico</h3><div class="grid"><label>Motivo de ingreso<textarea id="reason">'+esc(o.reason)+'</textarea></label><label>Diagnóstico / trabajos<textarea id="diagnosis">'+esc(o.diagnosis)+'</textarea></label></div><div class="grid"><label>Observaciones de recepción<textarea id="reception">'+esc(o.reception)+'</textarea></label><label>Responsable / mecánico<input id="mechanic" value="'+esc(o.mechanic)+'"></label></div><div><label>Checklist</label>'+["Exterior revisado","Interior revisado","Luces/testigos registrados","Combustible registrado"].map((x,i)=>'<label><input type="checkbox" id="ch'+i+'" style="width:auto" '+(o.checks?.[i]?"checked":"")+'>'+x+"</label>").join("")+"</div></div>"}function newBudget(){edit={id:"",no:no(),created:new Date().toISOString(),status:"Esperando aprobación",items:[],photos:[],checks:[],mode:"presupuesto"};newOT(edit)}function editOT(id){let o=db.ots.find(x=>x.id===id);if(o)newOT(o);else toast("OT no encontrada")}function newOT(o){if(o){edit=o}else{edit={id:"",no:no(),created:new Date().toISOString(),status:"Ingresado",items:[],photos:[],checks:[]}};$("#app").innerHTML='<div class="card"><h2>'+(edit.mode=="presupuesto"?"Presupuesto ":"Orden de Trabajo ")+esc(edit.no)+'</h2><div class="muted">'+fmt(edit.created)+'</div></div>'+fields(edit)+'<div class="card"><h3>Repuestos y mano de obra</h3><div id="items"></div><div class="actions np"><button class="btn primary" onclick="item(\'part\')">＋ Agregar repuesto</button><button class="btn primary" onclick="item(\'labor\')">＋ Agregar mano de obra</button></div><div id="total" class="total"></div></div><div class="card"><h3>Fotos de recepción</h3><input class="np" type="file" accept="image/*" multiple onchange="addPhotos(event)"><div id="photos" class="photos"></div></div><div class="card"><h3>Estado</h3><select id="status">'+["Ingresado","Diagnóstico","Esperando aprobación","En reparación","Listo","Entregado"].map(x=>'<option '+(x==edit.status?"selected":"")+'>'+x+"</option>").join("")+'</select><label>Observaciones finales<textarea id="obs">'+esc(edit.obs)+'</textarea></label></div><div class="actions np"><button class="btn primary" onclick="saveOT()">Guardar '+(edit.mode=="presupuesto"?"presupuesto":"OT")+'</button><button class="btn" onclick="go(\'home\')">Cancelar</button></div>';drawItems();drawPhotos()}function val(id){return $("#"+id)?.value||""}function loadPlate(p){let v=db.vehicles[plate(p)];if(!v)return;let c=db.clients[v.ck]||{};Object.keys(v).filter(k=>k!="ck").forEach(k=>{if($("#"+k))$("#"+k).value=v[k]});[["name","name"],["rut","rut"],["phone","phone"],["email","email"],["address","address"]].forEach(([a,b])=>{if(c[b]&&$("#"+a))$("#"+a).value=c[b]})}function item(t){edit.items.push({type:t,desc:"",qty:1,price:0});drawItems();setTimeout(()=>{let a=document.querySelectorAll("#items input.desc");a[a.length-1]?.focus()},50)}
function drawItems(){let a=edit.items||[];let parts=a.filter(x=>x.type=="part"),labor=a.filter(x=>x.type=="labor");const section=(title,type,arr)=>'<div class="card" style="margin:10px 0;background:#101014"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>'+title+'</b><button class="btn" onclick="item(\\''+type+'\\')">＋ Agregar</button></div>'+(arr.length?arr.map(x=>{let i=a.indexOf(x);return '<div class="line-item" data-i="'+i+'" style="padding:10px 0;border-bottom:1px solid var(--l)"><div class="grid" style="grid-template-columns:2fr .7fr 1fr auto;align-items:end"><label>Descripción<input class="desc" data-i="'+i+'" value="'+esc(x.desc||"")+'" placeholder="'+(type=="part"?"Ej: Filtro de aceite":"Ej: Cambio de aceite")+'"></label><label>Cantidad<input class="qty" data-i="'+i+'" type="number" min="1" value="'+(x.qty||1)+'"></label><label>Precio unitario<input class="price" data-i="'+i+'" type="number" min="0" value="'+(x.price||0)+'"></label><button class="btn del-item" data-i="'+i+'">×</button></div><div class="muted subtotal" style="text-align:right">Subtotal: '+money((x.qty||1)*(x.price||0))+'</div></div>'}).join(""):'<div class="muted" style="padding:10px 0">No hay '+(type=="part"?"repuestos":"mano de obra")+' agregados.</div>')+'</div>';$("#items").innerHTML=section("Repuestos","part",parts)+section("Mano de obra","labor",labor);$("#items").querySelectorAll("input.desc").forEach(el=>el.addEventListener("input",e=>{let i=+e.target.dataset.i;edit.items[i].desc=e.target.value;save()}));$("#items").querySelectorAll("input.qty").forEach(el=>el.addEventListener("input",e=>{let i=+e.target.dataset.i;edit.items[i].qty=+e.target.value||1;save();drawItemTotals()}));$("#items").querySelectorAll("input.price").forEach(el=>el.addEventListener("input",e=>{let i=+e.target.dataset.i;edit.items[i].price=+e.target.value||0;save();drawItemTotals()}));$("#items").querySelectorAll(".del-item").forEach(el=>el.addEventListener("click",e=>{let i=+e.currentTarget.dataset.i;edit.items.splice(i,1);save();drawItems()}));drawItemTotals()}function drawItemTotals(){let t=0;$("#items").querySelectorAll(".line-item").forEach(el=>{let i=+el.dataset.i,x=edit.items[i];if(x){let sub=(+x.qty||1)*(+x.price||0);t+=sub;let z=el.querySelector(".subtotal");if(z)z.textContent="Subtotal: "+money(sub)}});edit.total=t;if($("#total"))$("#total").textContent="Total: "+money(t)} function total(){let t=edit.items.reduce((s,x)=>s+x.qty*x.price,0);edit.total=t;if($("#total"))$("#total").textContent="Total: "+money(t)}function addPhotos(e){[...e.target.files].forEach(f=>{let r=new FileReader;r.onload=()=>{edit.photos.push(r.result);drawPhotos()};r.readAsDataURL(f)})}function drawPhotos(){$("#photos").innerHTML=(edit.photos||[]).map((p,i)=>'<div><img src="'+p+'"><button class="btn np" onclick="edit.photos.splice('+i+',1);drawPhotos()">×</button></div>').join("")}function saveOT(){let p=plate(val("plate"));if(!p)return toast("Ingresa la patente");let c={name:val("name"),rut:val("rut"),phone:val("phone"),email:val("email"),address:val("address")},v={km:val("km"),make:val("make"),model:val("model"),year:val("year"),color:val("color"),fuel:val("fuel"),vin:val("vin"),ck:c.rut||c.name};edit.plate=p;edit.client=c;edit.vehicle=v;edit.reason=val("reason");edit.diagnosis=val("diagnosis");edit.reception=val("reception");edit.mechanic=val("mechanic");edit.status=val("status");edit.obs=val("obs");edit.checks=[0,1,2,3].map(i=>$("#ch"+i)?.checked);edit.updated=new Date().toISOString();let i=db.ots.findIndex(x=>x.id==edit.id);if(i<0){edit.id=crypto.randomUUID();db.ots.push(edit)}else db.ots[i]=edit;db.clients[c.rut||c.name]=c;v.ck=c.rut||c.name;db.vehicles[p]=v;save();toast("OT guardada");setTimeout(()=>view(edit.id),250)}function view(id){edit=db.ots.find(x=>x.id==id);if(!edit)return;$("#app").innerHTML='<div class="card"><div class="actions np"><button class="btn" onclick="go(\'home\')">← Inicio</button><button class="btn primary" onclick="editOT(edit.id)">Editar</button><button class="btn" onclick="printOT()">Imprimir / PDF</button><button class="btn primary" onclick="shareOT()">📤 Compartir '+(edit.mode=="presupuesto"?"presupuesto":"OT")+'</button><button class="btn" onclick="wa()">WhatsApp</button></div><h2>'+(edit.mode=="presupuesto"?"PRESUPUESTO ":"ORDEN DE TRABAJO ")+esc(edit.no)+'</h2><div class="muted">'+fmt(edit.created)+' · '+status(edit.status)+'</div></div><div class="grid"><div class="card"><h3>Cliente</h3><b>'+esc(edit.client.name)+'</b><p>RUT: '+esc(edit.client.rut)+'<br>Tel: '+esc(edit.client.phone)+'<br>'+esc(edit.client.email)+'<br>'+esc(edit.client.address)+'</p></div><div class="card"><h3>Vehículo</h3><b>'+esc(edit.plate)+"</b> · "+esc(edit.vehicle.make)+" "+esc(edit.vehicle.model)+'<p>Año: '+esc(edit.vehicle.year)+' · KM: '+esc(edit.vehicle.km)+'<br>VIN: '+esc(edit.vehicle.vin)+'<br>'+esc(edit.vehicle.color)+' · '+esc(edit.vehicle.fuel)+'</p></div></div><div class="card"><h3>Recepción</h3><p>'+esc(edit.reason)+'</p><h3>Diagnóstico / trabajos</h3><p>'+esc(edit.diagnosis)+'</p><p>'+esc(edit.reception)+'</p><p>Responsable: <b>'+esc(edit.mechanic)+'</b></p></div><div class="card"><h3>Repuestos y mano de obra</h3><div class="actions np" style="margin-bottom:10px"><button class="btn primary" onclick="editOT(edit.id)">✏️ Modificar y agregar ítems</button><button class="btn" onclick="quickAdd(edit.id,\'part\')">＋ Repuesto</button><button class="btn" onclick="quickAdd(edit.id,\'labor\')">＋ Mano de obra</button></div><table style="width:100%"><tbody>'+edit.items.map(x=>'<tr><td>'+esc(x.type=="part"?"Repuesto":"Mano de obra")+'</td><td>'+esc(x.desc)+'</td><td>'+x.qty+'</td><td>'+money(x.price)+'</td><td>'+money(x.qty*x.price)+'</td></tr>').join("")+'</tbody></table><div class="total">TOTAL '+money(edit.total)+'</div></div><div class="card"><h3>Fotos</h3><div class="photos">'+(edit.photos||[]).map(p=>'<img src="'+p+'">').join("")+'</div></div>'}function quickAdd(id,type){let o=db.ots.find(x=>x.id===id);if(!o)return;o.items=o.items||[];o.items.push({type:type,desc:"",qty:1,price:0});edit=o;save();newOT(o);setTimeout(()=>{let a=document.querySelectorAll("#items input.desc");a[a.length-1]?.focus()},80)}function printOT(){window.print()}async function shareOT(){let rows=(edit.items||[]).map(x=>"- "+(x.type=="part"?"Repuesto":"Mano de obra")+": "+(x.desc||"Sin descripción")+" x"+(x.qty||1)+" = "+money((x.qty||1)*(x.price||0))).join("\n");let t="ANTONIO CARS SERVICE\n"+(edit.mode=="presupuesto"?"PRESUPUESTO ":"ORDEN DE TRABAJO ")+edit.no+"\n\nCliente: "+edit.client.name+"\nPatente: "+edit.plate+"\nVehículo: "+edit.vehicle.make+" "+edit.vehicle.model+"\nKilometraje: "+edit.vehicle.km+"\n\nDetalle:\n"+rows+"\n\nTOTAL: "+money(edit.total)+"\n\nEste presupuesto es emitido por Antonio Cars Service.";if(navigator.share){try{await navigator.share({title:edit.no,text:t})}catch(e){}}else{navigator.clipboard?.writeText(t);toast("Copiado")}}function wa(){let rows=(edit.items||[]).map(x=>"- "+(x.type=="part"?"Repuesto":"Mano de obra")+": "+(x.desc||"Sin descripción")+" x"+(x.qty||1)+" = "+money((x.qty||1)*(x.price||0))).join("\n");let t="ANTONIO CARS SERVICE\n"+(edit.mode=="presupuesto"?"PRESUPUESTO ":"ORDEN DE TRABAJO ")+edit.no+"\n\nCliente: "+edit.client.name+"\nPatente: "+edit.plate+"\nVehículo: "+edit.vehicle.make+" "+edit.vehicle.model+"\n\nDetalle:\n"+rows+"\n\nTOTAL: "+money(edit.total);location.href="https://wa.me/?text="+encodeURIComponent(t)}function open(){$("#app").innerHTML='<div class="card"><h2>OT abiertas</h2><div class="list">'+db.ots.filter(x=>x.status!="Entregado").sort((a,b)=>b.updated.localeCompare(a.updated)).map(card).join("")||'<div class="empty">No hay OT abiertas.</div>'+"</div></div>"}function history(){$("#app").innerHTML='<div class="card"><h2>Historial</h2><input id="q" placeholder="Patente, RUT, cliente u OT" oninput="drawHist()"><div id="hist" class="list" style="margin-top:10px"></div></div>';drawHist()}function drawHist(){let q=(val("q")||"").toLowerCase();$("#hist").innerHTML=db.ots.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).sort((a,b)=>b.created.localeCompare(a.created)).map(card).join("")||'<div class="empty">Sin resultados.</div>'}function clients(){$("#app").innerHTML='<div class="card"><h2>Clientes</h2><div class="list">'+Object.values(db.clients).map(c=>'<div class="item"><b>'+esc(c.name)+'</b><div class="muted">RUT '+esc(c.rut)+' · '+esc(c.phone)+'</div></div>').join("")||'<div class="empty">Se crean al guardar una OT.</div>'+"</div></div>"}function backup(){$("#app").innerHTML='<div class="card"><h2>Copia / Restaurar</h2><p class="muted">Las OT quedan guardadas localmente en este dispositivo.</p><div class="actions"><button class="btn primary" onclick="download()">Descargar respaldo</button><label class="btn">Restaurar<input class="hidden" type="file" accept=".json,application/json" onchange="restore(event)"></label></div></div>'}function download(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="antonio-cars-service-respaldo.json";a.click()}function restore(e){let r=new FileReader;r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.ots)throw 0;db=x;save();home();toast("Respaldo restaurado")}catch{toast("Archivo no válido")}};r.readAsText(e.target.files[0])}go("home");if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
