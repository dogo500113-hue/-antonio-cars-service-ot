<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080a">
<link rel="manifest" href="./manifest.webmanifest">
<title>Antonio Cars Service — OT</title>
<style>
:root{--r:#e21b2d;--r2:#ff3345;--bg:#07080a;--c:#14161a;--l:#30343a;--m:#a7abb1;--w:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--w);font:15px system-ui,-apple-system,BlinkMacSystemFont,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.top{padding:12px 15px;background:#090a0c;border-bottom:1px solid #292c31;position:sticky;top:0;z-index:3}
.brand{display:flex;gap:10px;align-items:center}.logoimg{width:180px;height:85px;border-radius:8px;object-fit:contain;object-position:center;background:#fff;padding:2px;display:block;flex:0 0 auto;image-rendering:auto}.muted{color:var(--m)}
main{max-width:1050px;margin:auto;padding:14px}.nav{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.nav button,.btn{border:1px solid var(--l);background:var(--c);color:#fff;border-radius:9px;padding:10px 12px;white-space:nowrap}.nav .on,.primary{background:var(--r);border-color:var(--r)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:14px;margin-bottom:12px}
.stat{font-size:27px;font-weight:800}label{display:block;font-size:12px;color:#ddd;margin-bottom:9px}input,select,textarea{width:100%;background:#101216;color:#fff;border:1px solid var(--l);border-radius:8px;padding:10px;margin-top:5px}textarea{min-height:75px}
.actions{display:flex;gap:7px;flex-wrap:wrap}.list{display:grid;gap:7px}.item{padding:11px;background:#101216;border:1px solid var(--l);border-radius:10px;cursor:pointer}.pill{border:1px solid var(--l);border-radius:99px;padding:4px 8px;font-size:11px}.red{color:#ff909a;border-color:#7b2029}.green{color:#72e0b5;border-color:#17684b}.total{text-align:right;font-size:21px;font-weight:800;margin-top:12px}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:7px}.empty{text-align:center;color:var(--m);padding:22px}.hidden{display:none!important}
.preview-shell{position:fixed;inset:0;background:#050608;z-index:9999;overflow:auto;padding:12px 10px 90px}.preview-bar{max-width:900px;margin:0 auto 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:0;z-index:2;padding:8px 0;background:#050608}.preview-bar b{font-size:17px}.preview-img{display:block;width:min(100%,900px);height:auto;margin:0 auto;border-radius:8px;box-shadow:0 15px 60px rgba(0,0,0,.65)}.preview-actions{max-width:900px;margin:12px auto 0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
@media(max-width:700px){.grid,.g3{grid-template-columns:1fr}.photos{grid-template-columns:repeat(3,1fr)}}
@media print{.top,.nav,.np{display:none!important}body{background:#fff;color:#111}.card{background:#fff;border:0}.muted{color:#555}}
</style>

<main><nav class="nav np"><button data-t="home">Inicio</button><button data-t="new">Nueva OT</button><button data-t="budget">Nuevo presupuesto</button><button data-t="open">OT abiertas</button><button data-t="history">Historial</button><button data-t="clients">Clientes</button><button data-t="backup">Copia / Restaurar</button></nav><div id="app"></div></main>
<div id="toast" class="hidden" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;padding:11px 15px;border-radius:9px;z-index:99999"></div>
<script>
const S="acs_ot_v2",$=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])),money=n=>new Intl.NumberFormat("es-CL",{style:"currency",currency:"CLP",maximumFractionDigits:0}).format(+n||0);
let db=JSON.parse(localStorage.getItem(S)||'{"seq":0,"ots":[],"clients":{},"vehicles":{}}'),edit=null;
function save(){localStorage.setItem(S,JSON.stringify(db))}
function toast(x){let t=$("#toast");t.textContent=x;t.classList.remove("hidden");setTimeout(()=>t.classList.add("hidden"),1900)}
function nextNo(prefix){db.seq++;return prefix+"-"+String(db.seq).padStart(6,"0")}
function no(){return nextNo("OT")}
function fmt(x){return new Date(x).toLocaleString("es-CL",{dateStyle:"short",timeStyle:"short"})}
function plate(x){return String(x||"").toUpperCase().replace(/[^A-Z0-9]/g,"")}
function status(x){return'<span class="pill '+(x=="En reparación"?"red":x=="Listo"||x=="Entregado"?"green":"")+'">'+esc(x)+"</span>"}
function go(t){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==t));({home,new:newOT,budget:newBudget,open,history,clients,backup}[t]||home)()}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>go(b.dataset.t));
function card(o){return'<div class="item" onclick="view(\''+o.id+'\')"><b>'+esc(o.no)+"</b> · "+esc(o.plate)+' <span style="float:right">'+status(o.status)+'</span><div class="muted">'+esc(o.client?.name||"")+" · "+esc(o.vehicle?.make||"")+" "+esc(o.vehicle?.model||"")+" · "+fmt(o.created)+'</div><small>Total '+money(o.total)+"</small></div>"}
function home(){$("#app").innerHTML='<div class="g3"><div class="card"><div class="muted">Total OT</div><div class="stat">'+db.ots.length+'</div></div><div class="card"><div class="muted">En reparación</div><div class="stat">'+db.ots.filter(x=>x.status=="En reparación").length+'</div></div><div class="card"><div class="muted">Listas</div><div class="stat">'+db.ots.filter(x=>x.status=="Listo").length+'</div></div></div><div class="card"><div class="actions np"><button class="btn primary" onclick="newOT()">＋ Nueva OT</button><button class="btn" onclick="newBudget()">＋ Nuevo presupuesto</button><button class="btn" onclick="go(\'history\')">Buscar patente</button></div></div><div class="card"><h3>Últimas OT</h3><div class="list">'+db.ots.slice(-8).reverse().map(card).join("")||'<div class="empty">No hay OT.</div>'+"</div></div>"}
function fields(o){let c=o.client||{},v=o.vehicle||{};return'<div class="grid"><div class="card"><h3>Cliente</h3><label>Nombre<input id="name" value="'+esc(c.name)+'"></label><div class="grid"><label>RUT<input id="rut" value="'+esc(c.rut)+'"></label><label>Teléfono<input id="phone" value="'+esc(c.phone)+'"></label></div><label>Email<input id="email" value="'+esc(c.email)+'"></label><label>Dirección<input id="address" value="'+esc(c.address)+'"></label></div><div class="card"><h3>Vehículo</h3><div class="grid"><label>Patente *<input id="plate" maxlength="8" value="'+esc(o.plate)+'" oninput="loadPlate(this.value)"></label><label>Kilometraje<input id="km" type="number" value="'+esc(v.km)+'"></label></div><div class="grid"><label>Marca<input id="make" value="'+esc(v.make)+'"></label><label>Modelo<input id="model" value="'+esc(v.model)+'"></label></div><div class="grid"><label>Año<input id="year" value="'+esc(v.year)+'"></label><label>Color<input id="color" value="'+esc(v.color)+'"></label></div><label>Combustible<select id="fuel"><option></option>'+["Bencina","Diésel","Híbrido","Eléctrico","Otro"].map(x=>'<option '+(x==v.fuel?"selected":"")+'>'+x+"</option>").join("")+'</select></label><label>VIN / Chasis<input id="vin" value="'+esc(v.vin)+'"></label></div></div><div class="card"><h3>Recepción y diagnóstico</h3><div class="grid"><label>Motivo de ingreso<textarea id="reason">'+esc(o.reason)+'</textarea></label><label>Diagnóstico / trabajos<textarea id="diagnosis">'+esc(o.diagnosis)+'</textarea></label></div><div class="grid"><label>Observaciones de recepción<textarea id="reception">'+esc(o.reception)+'</textarea></label><label>Responsable / mecánico<input id="mechanic" value="'+esc(o.mechanic)+'"></label></div><div><label>Checklist</label>'+["Exterior revisado","Interior revisado","Luces/testigos registrados","Combustible registrado"].map((x,i)=>'<label><input type="checkbox" id="ch'+i+'" style="width:auto" '+(o.checks?.[i]?"checked":"")+'>'+x+"</label>").join("")+"</div></div>"}
function newBudget(){edit={id:"",no:nextNo("PS"),created:new Date().toISOString(),status:"Pendiente",items:[],photos:[],checks:[],mode:"presupuesto"};newOT(edit)}

function compressPhoto(file,done){let r=new FileReader;r.onload=()=>{let im=new Image;im.onload=()=>{let max=1600,scale=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),w=Math.max(1,Math.round(im.naturalWidth*scale)),h=Math.max(1,Math.round(im.naturalHeight*scale)),c=document.createElement("canvas"),x=c.getContext("2d");c.width=w;c.height=h;x.drawImage(im,0,0,w,h);done(c.toDataURL("image/jpeg",.82))};im.onerror=()=>done(null);im.src=r.result};r.onerror=()=>done(null);r.readAsDataURL(file)}

function iconWhatsApp(x,y){
ctx.save();
ctx.fillStyle="#25D366";ctx.beginPath();ctx.arc(x,y,31,0,Math.PI*2);ctx.fill();
ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,25,0,Math.PI*2);ctx.stroke();
ctx.fillStyle="#fff";ctx.beginPath();
ctx.moveTo(x-8,y-13);ctx.quadraticCurveTo(x-15,y-5,x-9,y+5);
ctx.quadraticCurveTo(x-3,y+15,x+9,y+14);
ctx.quadraticCurveTo(x+15,y+12,x+17,y+6);
ctx.lineTo(x+8,y+1);ctx.quadraticCurveTo(x+4,y+7,x+1,y+5);
ctx.lineTo(x-5,y-2);ctx.quadraticCurveTo(x-1,y-6,x-2,y-10);
ctx.closePath();ctx.fill();
ctx.beginPath();ctx.moveTo(x-11,y+13);ctx.lineTo(x-19,y+21);ctx.lineTo(x-7,y+17);ctx.fill();

function showBudgetImage(){makeBudgetImage().then(c=>{let old=$("#imagePreview");if(old)old.remove();let modal=document.createElement("div");modal.id="imagePreview";modal.className="preview-shell";modal.innerHTML='<div class="preview-bar"><b>Vista previa profesional</b><button type="button" class="btn" id="closePreview">Cerrar</button></div><img id="previewImg" class="preview-img"><div class="preview-actions"><button class="btn primary" id="sharePreview">Compartir imagen</button><button class="btn" id="savePreview">Guardar imagen</button></div>';document.body.appendChild(modal);$("#previewImg").src=c.toDataURL("image/jpeg",.95);$("#closePreview").onclick=()=>modal.remove();$("#sharePreview").onclick=shareBudgetImage;$("#savePreview").onclick=async()=>{let b=await new Promise(r=>c.toBlob(r,"image/jpeg",.95)),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="antonio-cars-service-"+(edit.no||"documento")+".jpg";a.click();toast("Imagen guardada")}})}
async function shareBudgetImage(){try{let c=await makeBudgetImage();if(!c)return;let blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.95));let file=new File([blob],"antonio-cars-service-"+(edit.no||"documento")+".jpg",{type:"image/jpeg"});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({title:"Antonio Cars Service - "+edit.no,files:[file]});toast("Imagen lista para compartir")}else{let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=file.name;a.click();toast("Imagen descargada para WhatsApp")}}catch(e){if(e.name!="AbortError")toast("No se pudo generar la imagen")}}
function shareOT(){return shareBudgetImage()}function wa(){return shareBudgetImage()}
function open(){$("#app").innerHTML='<div class="card"><h2>OT abiertas</h2><div class="list">'+db.ots.filter(x=>x.status!="Entregado").sort((a,b)=>(b.updated||b.created).localeCompare(a.updated||a.created)).map(card).join("")||'<div class="empty">No hay OT abiertas.</div>'+"</div></div>"}
function history(){$("#app").innerHTML='<div class="card"><h2>Historial</h2><input id="q" placeholder="Patente, RUT, cliente u OT" oninput="drawHist()"><div id="hist" class="list" style="margin-top:10px"></div></div>';drawHist()}
function drawHist(){let q=(val("q")||"").toLowerCase();$("#hist").innerHTML=db.ots.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).sort((a,b)=>b.created.localeCompare(a.created)).map(card).join("")||'<div class="empty">Sin resultados.</div>'}
function clients(){$("#app").innerHTML='<div class="card"><h2>Clientes</h2><div class="list">'+Object.values(db.clients).map(c=>'<div class="item"><b>'+esc(c.name)+'</b><div class="muted">RUT '+esc(c.rut)+' · '+esc(c.phone)+'</div></div>').join("")||'<div class="empty">Se crean al guardar una OT.</div>'+"</div></div>"}
function backup(){$("#app").innerHTML='<div class="card"><h2>Copia / Restaurar</h2><p class="muted">Las OT quedan guardadas localmente en este dispositivo.</p><div class="actions"><button class="btn primary" onclick="download()">Descargar respaldo</button><label class="btn">Restaurar<input class="hidden" type="file" accept=".json,application/json" onchange="restore(event)"></label></div></div>'}
function download(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="antonio-cars-service-respaldo.json";a.click()}
function restore(e){let r=new FileReader;r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.ots)throw 0;db=x;save();home();toast("Respaldo restaurado")}catch{toast("Archivo no válido")}};r.readAsText(e.target.files[0])}
go("home");
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js?v=25",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});
</script>
</body></html>
